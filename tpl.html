<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ประวัติซ่อมบำรุงรายทะเบียน</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14222e;--mut:#5d6d7a;--line:#d8e0e6;--acc:#0b5c7a;--hi:#f2b705;--ok:#0f7a52;--soon:#a15c00;--bad:#c0392b;--none:#7b8791;--side:#0f2233;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1822;--card:#142431;--ink:#e8eff4;--mut:#93a6b4;--line:#243746;--acc:#4fb6d8;--ok:#4cc88b;--soon:#f0a53a;--bad:#ff8a7a;--none:#8a99a4;--side:#09121a}}
:root[data-theme="dark"]{--bg:#0c1822;--card:#142431;--ink:#e8eff4;--mut:#93a6b4;--line:#243746;--acc:#4fb6d8;--ok:#4cc88b;--soon:#f0a53a;--bad:#ff8a7a;--none:#8a99a4;--side:#09121a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif}
h1,h2,h3,.k b,.plate,.chip{font-family:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
.side{background:var(--side);color:#e6eef4;display:flex;flex-direction:column;min-height:0}
.side h1{font-size:17px;margin:0;padding:18px 18px 2px;font-weight:600;letter-spacing:.01em}
.side .sub{padding:0 18px 12px;color:#9fb1bf;font-size:12px}
.side input{margin:0 18px 10px;padding:9px 12px;border:1px solid #2c4357;border-radius:8px;background:#0a1824;color:#fff;font:inherit}
.side input::placeholder{color:#7e92a2}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 14px}
.chip{border:1px solid #34506a;background:none;color:#cfdce6;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:500;cursor:pointer}
.chip[aria-pressed=true]{background:var(--hi);border-color:var(--hi);color:#1a1400}
main .chip{border-color:var(--line);color:var(--ink)}
.list{overflow-y:auto;flex:1;border-top:1px solid #1d3347}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:9px 18px 9px 14px;border:0;border-left:4px solid transparent;border-bottom:1px solid #1a2f42;background:none;color:#e6eef4;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:#16314a}.row[aria-current=true]{background:#17344e;border-left-color:var(--hi)}
.row small{color:#9fb1bf;display:block;margin-top:2px}
.badge{font-size:11px;padding:0 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.soon{color:var(--soon)}.over{color:var(--bad)}.none{color:var(--none)}
.side .ok{color:#5ee0a0}.side .soon{color:#ffc857}.side .over{color:#ff9a8a}.side .none{color:#9fb1bf}
.plate{display:inline-block;background:#fff;color:#111;border:2px solid #16222c;border-radius:6px;padding:0 9px;font-weight:600;font-size:15px;line-height:1.5;letter-spacing:.03em}
.plate.big{font-size:30px;padding:2px 20px;border-width:3px;border-radius:10px;margin:12px 0 6px;box-shadow:0 0 0 1px #fff,0 0 0 2px var(--line)}
main{overflow-y:auto;padding:22px 28px 48px;min-width:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
h2{font-size:26px;margin:0 0 2px;font-weight:600}h3{font-size:15px;margin:0 0 10px;font-weight:500}
.mut{color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
.k{background:var(--card);padding:14px 18px}
.k b{display:block;font-size:28px;font-weight:600;line-height:1.2}.k span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:12px}td.n,th.n{text-align:right}
.bar{display:grid;grid-template-columns:110px 1fr 80px;gap:10px;align-items:center;margin:5px 0;font-size:13px}
.bar i{display:block;height:12px;background:var(--acc);border-radius:3px}
.ins{margin:0;padding-left:18px}.ins li{margin:5px 0}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px}
a.pl,.pl{color:var(--acc);cursor:pointer;background:none;border:0;font:inherit;font-weight:500;padding:0;text-decoration:underline;text-underline-offset:3px}
svg{max-width:100%;display:block}
@media(max-width:820px){.app{display:block;height:auto}.side{max-height:55vh}main{padding:16px}.bar{grid-template-columns:90px 1fr 70px}.plate.big{font-size:24px}}
</style></head><body>
<div class="app"><aside class="side"><h1>ประวัติซ่อมบำรุงรายทะเบียน</h1><div class="sub" id="sub"></div>
<input id="q" type="search" placeholder="ค้นหาทะเบียน / รุ่น" aria-label="ค้นหาทะเบียน"><div class="chips" id="chips"></div><div class="list" id="list"></div></aside>
<main id="main"></main></div>
<script>
const D=__DATA__;
const ref=D.ref,RP=['เบรก','ช่วงล่าง','แบตเตอรี่','คลัตซ์','โช้คอัพ'],PMKM=10000,PMD=183;
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const th=d=>new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
const f=n=>Math.round(n).toLocaleString('th-TH');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const med=a=>{if(!a.length)return 0;a=[...a].sort((x,y)=>x-y);return a[a.length>>1]};
const SL={over:'เลยรอบ',soon:'ใกล้ถึงรอบ',ok:'ปกติ',none:'ไม่มีประวัติเปลี่ยนน้ำมัน'};
const P=D.p.map(p=>{
 const v=p.v.filter(x=>!x.c).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
 const ks=v.map(x=>x.k).filter(k=>k!=null),cost=v.reduce((s,x)=>s+x.t,0);
 const oil=v.filter(x=>x.o&&!x.x),L=oil[oil.length-1],cur=ks.length?Math.max(...ks):null;
 const kmS=L&&L.k!=null&&cur!=null?cur-L.k:null,dS=L?dd(ref,L.d):null;
 let st='none';if(L)st=(kmS>PMKM||dS>PMD)?'over':(kmS>8500||dS>150)?'soon':'ok';
 const gaps=[];for(let i=1;i<oil.length;i++){const a=oil[i-1],b=oil[i],gk=a.k!=null&&b.k!=null?b.k-a.k:null,gd=dd(b.d,a.d);gaps.push({a,b,gk,gd,bad:(gk!=null&&gk>PMKM)||gd>PMD})}
 const rep=[];RP.forEach(g=>{const xs=v.filter(x=>x.i.some(i=>D.g[i[1]].startsWith(g)));for(let i=1;i<xs.length;i++)if(dd(xs[i].d,xs[i-1].d)<=120)rep.push({g,a:xs[i-1].d,b:xs[i].d})});
 let dq=0;for(let i=1;i<ks.length;i++)if(ks[i]<ks[i-1])dq++;
 const rng=ks.length?Math.max(...ks)-Math.min(...ks):0,ext=v.filter(x=>x.x).reduce((s,x)=>s+x.t,0);
 return{...p,v,cost,oil,L,cur,kmS,dS,st,gaps,rep,dq,ext,cpk:rng>1000?cost/rng*1000:null,last:v.length?v[v.length-1].d:null}});
const mm={};P.forEach(p=>mm[p.m]=(mm[p.m]||[]).concat(p.cost));
P.forEach(p=>{const m=med(mm[p.m]);p.hi=mm[p.m].length>=3&&p.cost>=2*m&&p.cost>0?p.cost/m:0});
const ord={over:0,soon:1,ok:2,none:3};
let sel=null,fl='all',q='';
const $=s=>document.querySelector(s);
const cnt=s=>P.filter(p=>s=='all'||p.st==s).length;
function bars(rows){const m=Math.max(...rows.map(r=>r[1]),1);return rows.map(r=>`<div class="bar"><span>${esc(r[0])}</span><i style="width:${r[1]/m*100}%"></i><span class="mut" style="text-align:right">${f(r[1])}</span></div>`).join('')}
function monthly(vs){const m={};vs.forEach(x=>{const k=x.d.slice(0,7);m[k]=(m[k]||0)+x.t});const ks=Object.keys(m).sort(),mx=Math.max(...ks.map(k=>m[k]),1);
 return `<svg viewBox="0 0 ${ks.length*20} 100" role="img" aria-label="ค่าซ่อมรายเดือน">${ks.map((k,i)=>`<rect x="${i*20+2}" y="${100-m[k]/mx*98}" width="16" height="${m[k]/mx*98}" fill="var(--acc)"><title>${k}: ${f(m[k])} บาท</title></rect>`).join('')}</svg><div class="mut" style="display:flex;justify-content:space-between;font-size:12px"><span>${ks[0]||''}</span><span>สูงสุด ${f(mx)} บาท/เดือน</span><span>${ks[ks.length-1]||''}</span></div>`}
function kmline(p){const pts=p.v.filter(x=>x.k!=null);if(pts.length<2)return'<p class="mut">ข้อมูลเลขไมล์ไม่พอสำหรับกราฟ</p>';
 const t0=+new Date(pts[0].d),t1=+new Date(pts[pts.length-1].d)||t0+1,ks=pts.map(x=>x.k),a=Math.min(...ks),b=Math.max(...ks);
 const X=x=>10+(new Date(x.d)-t0)/(t1-t0||1)*580,Y=x=>130-(x.k-a)/(b-a||1)*120;
 return `<svg viewBox="0 0 600 140" role="img" aria-label="เลขไมล์ตามเวลา"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map(x=>X(x)+','+Y(x)).join(' ')}"/>${pts.map(x=>`<circle cx="${X(x)}" cy="${Y(x)}" r="3" fill="${x.o?'var(--ok)':'var(--acc)'}"><title>${th(x.d)} · ${f(x.k)} กม.${x.o?' · เปลี่ยนน้ำมัน':''}</title></circle>`).join('')}</svg><div class="mut" style="font-size:12px">${f(a)} – ${f(b)} กม. · จุดเขียวคือเปลี่ยนน้ำมันเครื่อง</div>`}
const link=p=>`<button class="pl" data-p="${esc(p.id)}">${esc(p.id)}</button>`;
function list(){const s=q.trim().toLowerCase();const a=P.filter(p=>(fl=='all'||p.st==fl)&&(!s||(p.id+' '+p.m).toLowerCase().includes(s))).sort((x,y)=>ord[x.st]-ord[y.st]||x.id.localeCompare(y.id));
 $('#list').innerHTML=a.map(p=>`<button class="row" data-p="${esc(p.id)}" ${sel==p.id?'aria-current="true"':''}><span><span class="plate">${esc(p.id)}</span><small>${esc(p.m)} · ${p.v.length} ครั้ง</small></span><span class="badge ${p.st}">${SL[p.st]=='ไม่มีประวัติเปลี่ยนน้ำมัน'?'ไม่มีข้อมูล':SL[p.st]}</span></button>`).join('')||'<p class="mut" style="padding:14px">ไม่พบทะเบียนที่ตรงกับตัวกรอง</p>';
 $('#chips').innerHTML=[['all','ทั้งหมด'],['over','เลยรอบ'],['soon','ใกล้ถึงรอบ'],['ok','ปกติ'],['none','ไม่มีข้อมูล']].map(c=>`<button class="chip" data-f="${c[0]}" aria-pressed="${fl==c[0]}">${c[1]} ${cnt(c[0])}</button>`).join('')}
function fleet(){const vs=P.flatMap(p=>p.v),cost=vs.reduce((s,x)=>s+x.t,0),gaps=P.flatMap(p=>p.gaps),good=gaps.filter(g=>!g.bad).length;
 const gc={};vs.forEach(x=>x.i.forEach(i=>gc[D.g[i[1]]]=(gc[D.g[i[1]]]||0)+i[3]));const gr=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const hi=P.filter(p=>p.hi).sort((a,b)=>b.hi-a.hi).slice(0,8),rp=P.filter(p=>p.rep.length).sort((a,b)=>b.rep.length-a.rep.length).slice(0,8),ov=P.filter(p=>p.st=='over').sort((a,b)=>(b.dS||0)-(a.dS||0)).slice(0,10);
 return `<h2>ภาพรวมทั้งฟลีท</h2><div class="mut">ข้อมูลถึง ${th(ref)} · ไม่นับบิลที่ยกเลิก · เกณฑ์เปลี่ยนน้ำมันเครื่อง ${f(PMKM)} กม. หรือไม่เกิน 6 เดือน</div>
 <div class="kpis"><div class="k"><b>${P.length}</b><span>ทะเบียน</span></div><div class="k"><b>${f(vs.length)}</b><span>ครั้งที่เข้าซ่อม</span></div><div class="k"><b>${f(cost)}</b><span>ค่าซ่อมรวม (บาท)</span></div><div class="k"><b class="over">${cnt('over')}</b><span>คันที่เลยรอบน้ำมัน</span></div><div class="k"><b>${gaps.length?Math.round(good/gaps.length*100):0}%</b><span>เปลี่ยนน้ำมันตรงรอบ (${f(gaps.length)} รอบที่วัดได้)</span></div></div>
 <div class="grid"><div class="card"><h3>ค่าซ่อมรายเดือน</h3>${monthly(vs)}</div><div class="card"><h3>ค่าซ่อมตามกลุ่มสินค้า (บาท)</h3>${bars(gr)}</div></div>
 <div class="grid"><div class="card"><h3>เลยรอบน้ำมันเครื่อง นานสุด</h3><div class="scroll"><table><tr><th>ทะเบียน</th><th class="n">กม.ที่เลย</th><th class="n">วันนับจากครั้งล่าสุด</th></tr>${ov.map(p=>`<tr><td>${link(p)}</td><td class="n">${p.kmS!=null?f(p.kmS):'-'}</td><td class="n">${p.dS}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">ไม่มี</td></tr>'}</table></div></div>
 <div class="card"><h3>ค่าซ่อมสะสมสูงกว่ารุ่นเดียวกัน ≥ 2 เท่าของค่ากลาง</h3><div class="scroll"><table><tr><th>ทะเบียน</th><th>รุ่น</th><th class="n">ค่าซ่อม</th><th class="n">เท่าของค่ากลาง</th></tr>${hi.map(p=>`<tr><td>${link(p)}</td><td>${esc(p.m)}</td><td class="n">${f(p.cost)}</td><td class="n">${p.hi.toFixed(1)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">ไม่มี</td></tr>'}</table></div></div></div>
 <div class="card"><h3>ซ่อมระบบเดิมซ้ำภายใน 120 วัน (เบรก ช่วงล่าง แบตเตอรี่ คลัตช์ โช้คอัพ)</h3><div class="scroll"><table><tr><th>ทะเบียน</th><th class="n">จำนวนครั้งที่ซ้ำ</th><th>ระบบ</th></tr>${rp.map(p=>`<tr><td>${link(p)}</td><td class="n">${p.rep.length}</td><td>${[...new Set(p.rep.map(r=>r.g))].join(', ')}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">ไม่มี</td></tr>'}</table></div></div>
 <p class="mut">ผลวิเคราะห์เป็นสัญญาณให้ตรวจต่อ ไม่ใช่ข้อสรุป ข้อมูลไม่มีสาเหตุการเสีย และเลขไมล์บางบิลอาจกรอกคลาดเคลื่อน</p>`}
function car(p){const gc={};p.v.forEach(x=>x.i.forEach(i=>gc[D.g[i[1]]]=(gc[D.g[i[1]]]||0)+i[3]));const gr=Object.entries(gc).sort((a,b)=>b[1]-a[1]);
 const ins=[];
 ins.push(p.L?`น้ำมันเครื่องครั้งล่าสุด ${th(p.L.d)}${p.L.k!=null?' ที่ '+f(p.L.k)+' กม.':''} ผ่านมา ${p.dS} วัน${p.kmS!=null?' / '+f(p.kmS)+' กม.':''} → <b class="${p.st}">${SL[p.st]}</b>`:'ไม่พบประวัติเปลี่ยนน้ำมันเครื่องในศูนย์');
 if(p.gaps.length){const b=p.gaps.filter(g=>g.bad).length;ins.push(`เปลี่ยนน้ำมันตรงรอบ ${p.gaps.length-b} จาก ${p.gaps.length} รอบ${b?` (เกินรอบ ${b} ครั้ง)`:''}`)}
 if(p.hi)ins.push(`ค่าซ่อมสะสมสูงเป็น ${p.hi.toFixed(1)} เท่าของค่ากลางรุ่น ${esc(p.m)}`);
 if(p.rep.length)ins.push(`ซ่อมระบบเดิมซ้ำภายใน 120 วัน ${p.rep.length} ครั้ง: ${p.rep.map(r=>r.g+' ('+th(r.a)+' → '+th(r.b)+')').join(', ')}`);
 if(p.cost&&p.ext/p.cost>.25)ins.push(`ค่าซ่อมนอกศูนย์คิดเป็น ${Math.round(p.ext/p.cost*100)}% ของทั้งหมด`);
 if(p.dq)ins.push(`เลขไมล์ลดลงจากบิลก่อนหน้า ${p.dq} ครั้ง ควรตรวจความถูกต้อง`);
 const tl=[...p.v].reverse().map(x=>`<details><summary><span>${th(x.d)} · ${x.k!=null?f(x.k)+' กม.':'ไม่มีไมล์'} · ${esc(D.br[x.b])}${x.x?'<span class="tag">อู่นอก</span>':''}${x.o?'<span class="tag">เปลี่ยนน้ำมัน</span>':''}</span><b>${f(x.t)}</b></summary><div class="scroll"><table>${x.i.map(i=>`<tr><td>${esc(i[0])}</td><td>${esc(D.g[i[1]])}</td><td class="n">${i[2]}</td><td class="n">${f(i[3])}</td></tr>`).join('')||'<tr><td class="mut">ไม่มีรายการที่คิดเงิน</td></tr>'}</table></div>${x.f?`<div class="mut">รายการฟรี/ของแถม ${x.f} รายการ</div>`:''}</details>`).join('');
 return `<button class="chip" data-p="">← ภาพรวมฟลีท</button><div class="plate big">${esc(p.id)}</div><div class="mut">${esc(p.b)} ${esc(p.m)}${p.last?' · เข้าล่าสุด '+th(p.last):''}</div>
 <div class="kpis"><div class="k"><b>${p.v.length}</b><span>ครั้งที่เข้าซ่อม</span></div><div class="k"><b>${f(p.cost)}</b><span>ค่าซ่อมสะสม (บาท)</span></div><div class="k"><b>${p.cur!=null?f(p.cur):'-'}</b><span>เลขไมล์ล่าสุด (กม.)</span></div><div class="k"><b>${p.cpk!=null?f(p.cpk):'-'}</b><span>ค่าซ่อมต่อ 1,000 กม.</span></div><div class="k"><b class="${p.st}">${SL[p.st]=='ไม่มีประวัติเปลี่ยนน้ำมัน'?'ไม่มีข้อมูล':SL[p.st]}</b><span>สถานะน้ำมันเครื่อง</span></div></div>
 <div class="card"><h3>ข้อสังเกตอัตโนมัติ</h3><ul class="ins">${ins.map(i=>'<li>'+i+'</li>').join('')}</ul></div>
 <div class="grid"><div class="card"><h3>เลขไมล์ตามเวลา</h3>${kmline(p)}</div><div class="card"><h3>ค่าซ่อมตามกลุ่มสินค้า (บาท)</h3>${bars(gr.slice(0,8))||'<p class="mut">ไม่มีข้อมูล</p>'}</div></div>
 <div class="card"><h3>ค่าซ่อมรายเดือน</h3>${monthly(p.v)}</div>
